<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8534f" />
    <title>Cooking — 共有レシピ & 買い物リスト</title>
    <!--
      GitHub Pages SPA フォールバックの復元側（rafgraph/spa-github-pages 方式）。
      404.html がクエリに退避したパスを、元のクリーンURLへ書き戻す。
      他ホスト（Firebase Hosting 等、サーバ側リライトあり）では何もしない。
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
