<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Cooking</title>
    <!--
      GitHub Pages 用 SPA フォールバック（rafgraph/spa-github-pages 方式）。
      Pages はサーバ側のリライトが無いため、/space/xxx を直接開くと 404 になる。
      その 404 をこのページで受け、クエリにパスを退避して index.html へ転送する。
      index.html 側のスクリプトが元のクリーンURLへ戻す。
      pathSegmentsToKeep=1 は先頭の "/Cooking" を保持する設定。
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
